<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N30NH4T Studio GYM OS</title>

<style>
:root{
--bg:#0a0a0a;
--card:#141414;
--accent:#00ff88;
--red:#ff3b3b;
--gold:#ffd700;
--muted:#9aa0a6;
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:white;
}

/* SPLASH */
#splash{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:999;
text-align:center;
}

.logo{
font-size:26px;
font-weight:800;
animation:pulse 1.5s infinite;
}

.sub{color:#888;font-size:12px;margin-top:8px;}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.05)}
100%{transform:scale(1)}
}

/* APP */
#app{
display:none;
padding:16px;
padding-bottom:120px;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.streak{
color:var(--accent);
font-weight:bold;
}

/* CARD */
.card{
background:var(--card);
border-radius:18px;
padding:16px;
margin-bottom:12px;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:14px;
background:var(--accent);
color:black;
font-weight:700;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.03);
}

button:active{
transform:scale(0.97);
}

button:disabled{
background:#333;
color:#777;
cursor:not-allowed;
}

button.danger{
background:var(--red);
color:white;
}

/* INPUT */
input{
width:100%;
padding:10px;
margin-top:6px;
border-radius:12px;
border:none;
background:#1a1a1a;
color:white;
}

/* WORKOUT */
.workout{
background:#101010;
border-radius:16px;
padding:14px;
margin-bottom:10px;
}

/* CALENDAR */
.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
}

.daybox{
background:#1a1a1a;
padding:10px;
border-radius:10px;
text-align:center;
font-size:12px;
color:#aaa;
}

.daybox.done{
background:var(--red);
color:white;
font-weight:bold;
}

.daybox.today{
border:1px solid var(--accent);
}

/* MODAL */
#modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.85);
z-index:999;
padding:20px;
}

.modal-box{
background:#141414;
padding:16px;
border-radius:16px;
max-width:600px;
margin:auto;
overflow:auto;
max-height:90vh;
}

.win{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
z-index:9999;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

.win h1{
color:var(--gold);
font-size:26px;
}

.win p{
color:var(--red);
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<div class="logo">N30NH4T Studio (GYM)</div>
<div class="sub">created by N30NH4T</div>
</div>

<!-- WIN -->
<div id="win" class="win">
<h1>HÉT SIKERESEN TELJESÍTVE</h1>
<p>reseteld a teljes hetet</p>
</div>

<div id="app">

<div class="header">
<div>GYM OS</div>
<div class="streak">🔥 <span id="streak">0</span></div>
</div>

<!-- XP -->
<div class="card">
XP: <span id="xp">0</span> / 1000
</div>

<!-- PROTEIN -->
<div class="card">
<h3>🥩 Protein</h3>
<div id="proteinText"></div>
<input id="proteinInput">
<button onclick="addProtein()">+ Protein</button>
<button class="danger" onclick="resetProtein()">Reset</button>
</div>

<!-- CREATINE -->
<div class="card">
<h3>💊 Kreatin</h3>
<div id="creatineText"></div>
<button onclick="addCreatine()">+1g</button>
<button class="danger" onclick="resetCreatine()">Reset</button>
</div>

<!-- CALENDAR -->
<div class="card">
<h3>📅 Naptár</h3>
<div id="calendar"></div>
<button onclick="openWeek()">📊 Teljes hét megtekintése</button>
</div>

<!-- WORKOUTS -->
<div id="workouts"></div>

<button class="danger" onclick="resetAll()">RESET MINDEN</button>

</div>

<!-- MODAL -->
<div id="modal">
<div class="modal-box">
<h2 id="mTitle"></h2>
<div id="mText"></div>
<button onclick="closeModal()">Bezárás</button>
</div>
</div>

<script>

/* SPLASH */
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("app").style.display="block";
},1500);

/* DATA */
let xp=parseInt(localStorage.getItem("xp"))||0;
let protein=parseInt(localStorage.getItem("protein"))||0;
let creatine=parseInt(localStorage.getItem("creatine"))||0;
let streak=parseInt(localStorage.getItem("streak"))||0;
let finished=JSON.parse(localStorage.getItem("finished")||"{}");

const XP_TARGET=1000;

/* WEEK */
const plan=[
{
name:"Hétfő – Push",
xp:250,
detail:`Mellnyomó 4×8–12<br>Ferde 3×8–12<br>Pec Deck 3×12–15<br>Vállnyomó 3×8–12<br>Tricepsz`
},
{
name:"Kedd – Pull",
xp:250,
detail:`Lehúzás 4×8–12<br>Evező 4×8–12<br>Bicepsz`
},
{
name:"Csütörtök – Láb",
xp:250,
detail:`Lábtoló 4×10–15<br>Hack squat 3×8–12<br>Combhajlító`
},
{
name:"Péntek – Full",
xp:250,
detail:`Mell, hát, váll, kar`
}
];

render();
renderCalendar();
checkWin();

/* RENDER */
function render(){

document.getElementById("xp").innerText=xp;
document.getElementById("streak").innerText=streak;

document.getElementById("proteinText").innerText=protein+"/140g";
document.getElementById("creatineText").innerText=creatine+"/5g";

let out="";

plan.forEach((p,i)=>{
let done=finished[i];

out+=`
<div class="workout">
<h3>${p.name}</h3>

<button onclick="openModal(${i})">Feladat megnyitása</button>

<button onclick="finish(${i})" ${done?'disabled':''}>
Nap lezárása (+${p.xp} XP)
</button>
</div>
`;
});

document.getElementById("workouts").innerHTML=out;
}

/* FINISH */
function finish(i){

if(!finished[i]){
finished[i]=true;
xp+=plan[i].xp;
streak++;

localStorage.setItem("finished",JSON.stringify(finished));
localStorage.setItem("xp",xp);
localStorage.setItem("streak",streak);
}

render();
renderCalendar();
checkWin();
}

/* WIN */
function checkWin(){

let all=Object.keys(finished).length===plan.length;

if(all && xp>=XP_TARGET){
document.getElementById("win").style.display="flex";

setTimeout(()=>{
document.getElementById("win").style.display="none";
},5000);
}
}

/* PROTEIN */
function addProtein(){
let v=parseInt(document.getElementById("proteinInput").value);
if(!v)return;
protein+=v;
localStorage.setItem("protein",protein);
render();
}

function resetProtein(){
protein=0;
localStorage.setItem("protein",0);
render();
}

/* CREATINE */
function addCreatine(){
if(creatine<5){
creatine++;
localStorage.setItem("creatine",creatine);
render();
}
}

function resetCreatine(){
creatine=0;
localStorage.setItem("creatine",0);
render();
}

/* CALENDAR */
function renderCalendar(){
let cal=document.getElementById("calendar");
let t=new Date();
let y=t.getFullYear();
let m=t.getMonth();

let first=new Date(y,m,1).getDay();
let days=new Date(y,m+1,0).getDate();

let html='<div class="calendar">';

for(let i=0;i<first;i++) html+="<div></div>";

for(let d=1;d<=days;d++){
let key=y+"-"+m+"-"+d;
let done=finished[d%plan.length===0?3:d%plan.length];

html+=`
<div class="daybox ${done?'done':''}">
${d}
</div>
`;
}

html+='</div>';
cal.innerHTML=html;
}

/* MODAL */
function openModal(i){
document.getElementById("mTitle").innerText=plan[i].name;
document.getElementById("mText").innerHTML=plan[i].detail;
document.getElementById("modal").style.display="block";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

/* WEEK MODAL */
function openWeek(){
alert("Teljes heti edzésterv megnyitva ✔");
}

/* RESET */
function resetAll(){
localStorage.clear();
location.reload();
}

</script>

</body>
</html>
