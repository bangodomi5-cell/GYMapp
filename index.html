<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYM OS FIRE FIX</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
overflow:auto;
}

/* 🔥 FIRE BACKGROUND */
#fire{
position:fixed;
inset:0;
z-index:-2;
pointer-events:none;
}

/* APP */
#app{
display:none;
position:relative;
z-index:2;
padding:16px;
padding-bottom:140px;
}

/* CARD */
.card{
background:#141414;
padding:16px;
border-radius:16px;
margin-bottom:12px;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:14px;
background:#00ff88;
color:black;
font-weight:700;
cursor:pointer;
}

button:disabled{
background:#333;
color:#777;
}

/* BAR */
.bar{
width:100%;
height:12px;
background:#222;
border-radius:10px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
transition:.5s;
background:linear-gradient(90deg,#00ff88,#00b3ff);
}

/* INPUT */
input{
width:100%;
padding:10px;
margin-top:6px;
border-radius:10px;
border:none;
background:#1a1a1a;
color:white;
}

/* RESET */
#resetBar{
position:fixed;
bottom:0;
width:100%;
padding:10px;
background:rgba(0,0,0,0.9);
z-index:10;
}

#resetBar button{
background:#ff3b3b;
color:white;
}
</style>
</head>

<body>

<!-- 🔥 FIRE -->
<canvas id="fire"></canvas>

<div id="app">

<div class="card">
<h3>⚡ XP</h3>
<div class="bar"><div id="xpFill" class="fill"></div></div>
<div><span id="xpText">0</span> / 1000</div>
</div>

<div class="card">
<h3>🏆 Szint</h3>
<div class="bar"><div id="levelFill" class="fill"></div></div>
<div><span id="levelText">1</span> / 5</div>
</div>

<div class="card">
<h3>🥩 Protein</h3>
<input id="proteinInput" type="number" placeholder="gramm">
<button onclick="addProtein()">+ Protein</button>
<div class="bar"><div id="proteinFill" class="fill"></div></div>
<div><span id="proteinText">0</span> / 140g</div>
</div>

<div class="card">
<h3>💊 Kreatin</h3>
<input id="creatineInput" type="number" placeholder="gramm">
<button onclick="addCreatine()">+ Kreatin</button>
<div class="bar"><div id="creatineFill" class="fill"></div></div>
<div><span id="creatineText">0</span> / 5g</div>
</div>

<div id="workouts"></div>

</div>

<!-- RESET -->
<div id="resetBar">
<button onclick="resetAll()">RESET MINDEN</button>
</div>

<script>

/* SHOW APP */
setTimeout(()=>{
document.getElementById("app").style.display="block";
},800);

/* DATA */
let xp=+localStorage.getItem("xp")||0;
let protein=+localStorage.getItem("protein")||0;
let creatine=+localStorage.getItem("creatine")||0;
let finished=JSON.parse(localStorage.getItem("finished")||"{}");

/* PLAN */
const PLAN=[
{name:"Hétfő – Push",xp:250},
{name:"Kedd – Pull",xp:250},
{name:"Csütörtök – Láb",xp:250},
{name:"Péntek – Full",xp:250}
];

/* INIT */
render();
update();

/* LEVEL */
function level(){
return Math.min(Math.floor(xp/200)+1,5);
}

/* RENDER */
function render(){
let html="";

PLAN.forEach((p,i)=>{
html+=`
<div class="card">
<h3>${p.name}</h3>
<button onclick="finish(${i})" ${finished[i]?"disabled":""}>
Nap lezárása (+${p.xp} XP)
</button>
</div>
`;
});

document.getElementById("workouts").innerHTML=html;
}

/* FINISH */
function finish(i){
if(finished[i])return;

finished[i]=true;
xp+=PLAN[i].xp;

localStorage.setItem("xp",xp);
localStorage.setItem("finished",JSON.stringify(finished));

render();
update();
}

/* PROTEIN */
function addProtein(){
let v=+document.getElementById("proteinInput").value;
if(!v)return;

protein+=v;
localStorage.setItem("protein",protein);
update();
}

/* KREATIN */
function addCreatine(){
let v=+document.getElementById("creatineInput").value;
if(!v)return;

if(creatine+v>5) return alert("Max 5g!");

creatine+=v;
localStorage.setItem("creatine",creatine);
update();
}

/* UPDATE */
function update(){

document.getElementById("xpText").innerText=xp;
document.getElementById("xpFill").style.width=Math.min(xp/10,100)+"%";

let lv=level();
document.getElementById("levelText").innerText=lv;
document.getElementById("levelFill").style.width=(lv/5)*100+"%";

document.getElementById("proteinText").innerText=protein;
document.getElementById("proteinFill").style.width=(protein/140)*100+"%";

document.getElementById("creatineText").innerText=creatine;
document.getElementById("creatineFill").style.width=(creatine/5)*100+"%";
}

/* RESET */
function resetAll(){
localStorage.clear();
location.reload();
}

/* 🔥 FIRE FIXED */
const canvas=document.getElementById("fire");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let particles=[];

function P(){
this.x=Math.random()*canvas.width;
this.y=canvas.height;
this.s=Math.random()*6+2;
this.sp=Math.random()*3+1;
this.c=`rgba(255,${Math.random()*150},0,0.8)`;
}

function loop(){
ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach((p,i)=>{
p.y-=p.sp;
p.x+=Math.sin(p.y*0.01)*2;
p.s*=0.99;

ctx.beginPath();
ctx.fillStyle=p.c;
ctx.arc(p.x,p.y,p.s,0,Math.PI*2);
ctx.fill();

if(p.y<0)particles.splice(i,1);
});

for(let i=0;i<3;i++)particles.push(new P());

requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
