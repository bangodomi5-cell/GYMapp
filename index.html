<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MambaGYM Ultra Pro</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0c10;
color:white;
overflow:hidden;
}

/* SPLASH */
#splash{
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:radial-gradient(circle at top,#1f1f3a,#0b0c10);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:999;
}

.logo{
font-size:28px;
font-weight:bold;
letter-spacing:2px;
animation:pulse 1.5s infinite;
}

.loader{
margin-top:20px;
width:140px;
height:4px;
background:#222;
border-radius:10px;
overflow:hidden;
}

.loader div{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff88,#00b3ff);
animation:load 2.2s forwards;
}

@keyframes load{100%{width:100%;}}

#app{
display:none;
height:100vh;
overflow:auto;
padding-bottom:100px;
}

header{
text-align:center;
padding:14px;
font-weight:bold;
background:rgba(255,255,255,0.03);
backdrop-filter:blur(10px);
}

.card{
background:rgba(255,255,255,0.06);
margin:12px;
padding:14px;
border-radius:18px;
backdrop-filter:blur(12px);
box-shadow:0 0 20px rgba(0,255,200,0.08);
animation:fade .3s ease;
}

@keyframes fade{
from{opacity:0;transform:scale(.97)}
to{opacity:1;transform:scale(1)}
}

button{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:14px;
font-weight:bold;
color:white;
cursor:pointer;
background:linear-gradient(90deg,#00ff88,#00b3ff);
transition:0.2s;
}

button:active{transform:scale(0.98);}

input{
width:100%;
padding:10px;
margin-top:6px;
border-radius:12px;
border:none;
background:#1a1a1a;
color:white;
}

.barbg{
height:10px;
background:#222;
border-radius:10px;
overflow:hidden;
margin-top:8px;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff88,#00b3ff);
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:rgba(0,0,0,0.7);
backdrop-filter:blur(10px);
border-top:1px solid #222;
}

.nav button{
flex:1;
background:none;
border:none;
padding:14px;
color:white;
}

.done{
opacity:0.5;
text-decoration:line-through;
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<div class="logo">🔥 MAMBA GYM</div>
<div class="loader"><div></div></div>
</div>

<div id="app">

<header>MAMBA GYM ULTRA PRO</header>

<!-- PROTEIN -->
<div class="card">
<h3>🥩 Fehérje</h3>
<div id="proteinText">0 / 140g</div>
<input id="proteinInput" type="number">
<button onclick="addProtein()">+ Fehérje</button>
<div class="barbg"><div class="bar" id="pbar"></div></div>
</div>

<!-- STREAK -->
<div class="card">
<h3>🔥 Streak</h3>
<div id="streak">0</div>
<button onclick="finishDay()">VÉGZÉS</button>
<button style="background:red" onclick="resetAll()">RESET MINDEN</button>
</div>

<!-- RUN -->
<div class="card">
<h3>🏃 Futás napló</h3>
<input id="runTime" placeholder="Idő (perc)">
<input id="runKm" placeholder="Km">
<input id="runCal" placeholder="Kalória">
<button onclick="addRun()">Hozzáadás</button>
<div id="runList"></div>
</div>

<!-- WORKOUT -->
<div class="card">
<h3 id="wtitle">Edzés</h3>
<div id="workout"></div>
<div class="barbg"><div class="bar" id="wbar"></div></div>
</div>

<!-- IMAGE -->
<div class="card">
<h3>📸 Kép feltöltés</h3>
<input type="file" accept="image/*" onchange="loadImage(event)">
<img id="preview" style="display:none; margin-top:10px; border-radius:12px; max-width:100%;">
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="loadWorkout()">🏠</button>
<button>🏋️</button>
<button>⏱</button>
<button>📸</button>
</div>

<script>

setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("app").style.display="block";
},2200);

let goal=140;
let protein=parseInt(localStorage.getItem("protein"))||0;
let streak=parseInt(localStorage.getItem("streak"))||0;
let finished=false;

const plan=[
{name:"Hétfő",ex:["Mell","Váll","Tricepsz"]},
{name:"Kedd",ex:["Hát","Bicepsz"]},
{name:"Csütörtök",ex:["Láb"]},
{name:"Péntek",ex:["Full Upper"]}
];

let day=new Date().getDay();
if(day==3) day=2;
if(day>3) day=3;

loadWorkout();
update();

/* UPDATE */
function update(){
document.getElementById("proteinText").innerText=protein+" / 140g";
document.getElementById("pbar").style.width=Math.min((protein/goal)*100,100)+"%";
document.getElementById("streak").innerText=streak;

renderRuns();
}

/* PROTEIN */
function addProtein(){
let v=parseInt(document.getElementById("proteinInput").value);
if(!v)return;
protein+=v;
localStorage.setItem("protein",protein);
update();
}

/* WORKOUT */
function loadWorkout(){
let p=plan[day];
document.getElementById("wtitle").innerText=p.name;

let saved=JSON.parse(localStorage.getItem("w_"+day)||"[]");

document.getElementById("workout").innerHTML=
p.ex.map((e,i)=>`
<label class="${finished?'done':''}">
<input type="checkbox" ${saved[i]?"checked":""} ${finished?"disabled":""}
onchange="saveWorkout();updateBar();">
${e}
</label>
`).join("");

updateBar();
}

function saveWorkout(){
let boxes=document.querySelectorAll("#workout input");
let arr=[];
boxes.forEach(b=>arr.push(b.checked));
localStorage.setItem("w_"+day,JSON.stringify(arr));
}

function updateBar(){
let boxes=document.querySelectorAll("#workout input");
let done=0;
boxes.forEach(b=>{if(b.checked)done++;});
document.getElementById("wbar").style.width=(done/boxes.length)*100+"%";
}

/* FINISH DAY */
function finishDay(){
finished=true;
if(doneAll()){
streak++;
}
localStorage.setItem("streak",streak);
update();
loadWorkout();
}

function doneAll(){
let boxes=document.querySelectorAll("#workout input");
return [...boxes].every(b=>b.checked);
}

/* RESET */
function resetAll(){
localStorage.clear();
location.reload();
}

/* RUN */
function addRun(){
let t=document.getElementById("runTime").value;
let k=document.getElementById("runKm").value;
let c=document.getElementById("runCal").value;

let data=JSON.parse(localStorage.getItem("runs")||"[]");
data.push({t,k,c});
localStorage.setItem("runs",JSON.stringify(data));

update();
}

function renderRuns(){
let data=JSON.parse(localStorage.getItem("runs")||"[]");
document.getElementById("runList").innerHTML=
data.map(r=>`🏃 ${r.t} perc - ${r.k} km - ${r.c} kcal`).join("<br>");
}

/* IMAGE */
function loadImage(e){
let file=e.target.files[0];
let reader=new FileReader();

reader.onload=function(){
let img=document.getElementById("preview");
img.src=reader.result;
img.style.display="block";

localStorage.setItem("img",reader.result);
}

reader.readAsDataURL(file);
}

/* LOAD IMAGE */
let savedImg=localStorage.getItem("img");
if(savedImg){
let img=document.getElementById("preview");
img.src=savedImg;
img.style.display="block";
}

</script>

</body>
</html>
